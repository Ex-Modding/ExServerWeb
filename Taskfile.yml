version: "3"

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list

  dev:
    desc: "Start local development server"
    cmds:
      - npm run dev

  build:
    desc: "Build production bundle for Vercel"
    cmds:
      - npm run build

  lint:
    desc: "Run ESLint checks"
    cmds:
      - npm run lint

  format:
    desc: "Format code using Prettier"
    cmds:
      - npx prettier --write .

  test:
    desc: "Execute test suite"
    cmds:
      - npm test --if-present

  pre-commit:
    desc: "Mandatory verification gate (lint + test)"
    cmds:
      - task: lint
      - task: test

  deploy:
    desc: "Deploy project to Vercel"
    cmds:
      - npx vercel --prod
